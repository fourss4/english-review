# 수업 처리기 설정. 이 파일을 복사해 config.toml 로 저장하세요(setup.bat이 자동 복사).
# API 키는 여기에 쓰지 말고 tools/.env 에 넣습니다.

[llm]
# anthropic(Claude) | openai_compat(OpenAI 등 호환 API) | manual(복사·붙여넣기, 키 불필요) | mock(테스트)
provider = "anthropic"
# 모델 ID: Anthropic 콘솔(Models 문서)에서 현재 제공되는 ID를 확인해 그대로 입력하세요. 예) "claude-sonnet-..." 
model = ""
max_tokens = 8000
temperature = 0.3
api_key_env = "ANTHROPIC_API_KEY"
timeout_sec = 180
# openai_compat 일 때만:
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"

[stt]
# tiny.en(빠름) < base.en < small.en(권장) < medium.en(정확, 느림)
model = "small.en"
language = "en"
device = "cpu"
compute_type = "int8"

[privacy]
# AI로 보내기 전에 가릴 단어(선생님 이름 등)
mask_words = []

[paths]
# Langdy 폴더 기준 상대 경로. private/ 는 GitHub에 올라가지 않습니다.
inbox = "private/inbox"
out = "private/out"
work = "private/work"
archive = "private/archive"
